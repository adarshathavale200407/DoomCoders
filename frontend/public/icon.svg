<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Civic Fix" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Civic Fix</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27876f"/>
      <stop offset="1" stop-color="#1f6f5c"/>
    </linearGradient>
  </defs>
  <!-- background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- city skyline -->
  <g fill="#ffffff" opacity="0.16">
    <rect x="52" y="330" width="62" height="130"/>
    <rect x="126" y="290" width="54" height="170"/>
    <rect x="332" y="300" width="58" height="160"/>
    <rect x="402" y="344" width="58" height="116"/>
  </g>
  <!-- road -->
  <rect x="0" y="440" width="512" height="72" fill="#14493d" opacity="0.55"/>
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.5">
    <line x1="48" y1="476" x2="120" y2="476"/>
    <line x1="164" y1="476" x2="236" y2="476"/>
    <line x1="280" y1="476" x2="352" y2="476"/>
    <line x1="396" y1="476" x2="464" y2="476"/>
  </g>
  <!-- ground shadow -->
  <ellipse cx="256" cy="438" rx="62" ry="12" fill="#000000" opacity="0.25"/>
  <!-- map pin -->
  <path d="M256 88c-70 0-126 54-126 122 0 88 126 224 126 224s126-136 126-224c0-68-56-122-126-122z"
        fill="#e4572e" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>
  <!-- pin inner circle -->
  <circle cx="256" cy="208" r="74" fill="#ffffff"/>
  <!-- check mark = fixed -->
  <path d="M220 210l27 28 51-58" fill="none" stroke="#1f6f5c" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
